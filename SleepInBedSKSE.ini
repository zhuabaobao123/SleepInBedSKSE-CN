[Input]

; 在床上时打开睡眠菜单的按键。-1 = 使用游戏的等待键。
; 键盘 = DirectX 扫描码；手柄 = 266（十字键上）到 281（右扳机）。
iSleepKey=-1


[Bed]

; 1 = 允许躺上有主人的床，以及已有 NPC 预定的床；0 = 拒绝这两者。
bAllowOwnedBeds=1

; 1 = 躺下后自动打开睡眠菜单。
bOpenSleepMenuOnLieDown=1


[Followers]

; 1 = 玩家躺下时，随从在附近的空床上躺下，玩家起床时一同起床。
bEnabled=1

; 1 = 同行的配偶使用玩家双人床的另一个空睡位。
bSpouseSharesBed=1

; 1 = 附近但未同行的配偶也使用玩家双人床的空睡位。
bHomeSpouseSharesBed=1

; 1 = 没有配偶同床时，最近的随从使用玩家床的另一个空睡位。
bFollowersShareBed=1

; 1 = 使用任何空床；0 = 只使用无主的床，以及玩家或该随从拥有的床。
bIgnoreOwnership=0

; 搜索床铺的距离（游戏单位，以玩家和随从为中心）。
fSearchRadius=1024

; 1 = 只在下方夜间时间段内让随从就寝。
bNightOnly=0

; 夜间时间段的开始，游戏小时 0-23.99。
fNightStart=20

; 夜间时间段的结束，游戏小时 0-23.99（结束早于开始则跨过午夜）。
fNightEnd=6


[Undress]

; 躺下前脱下、起床后穿回的范围：
; 0 = 不脱，1 = 脱掉全身，2 = 除身体槽位那件外全脱。
; 玩家。
iPlayer=1

; 本 mod 安排就寝的随从和配偶。
iNpcs=2

; 1 = 安装了 Immersive Equipping Animations 时逐件穿脱并播放动画。
bAnimations=1


[Logging]

; 1 = 写入 SleepInBedSKSE.log
bEnabled=0
